version: "3.8"

# Portainer stack for llmux + vLLM services with CRIU checkpoint/restore.
#
# Ports are configurable via environment variables (defaults shown):
#   LLMMUX_PORT=11434          llmux proxy port
#   PORT_HA=8001               home_assistant port
#   PORT_IMAGES=8002           images port
#   PORT_EMBED=8003            embeddings port
#
# Deploy via Portainer → Stack → from repository:
#   repository: https://github.com/your-org/llmux
#   git_folder: .
#   Template: docker-compose.yml
#
# Or locally:
#   docker compose -f docker-compose.yml up -d
#   ./warmup.sh          # one-time: pre-build checkpoints for fast first wake

services:
  # ── llmux proxy (CPU only) ─────────────────────────────────────────────
  llmux:
    image: local/llmux:latest
    container_name: llmux
    build:
      context: .
      dockerfile_inline: |
        ARG RUST_VERSION=1.88
        FROM rust:${RUST_VERSION}-bookworm as builder

        WORKDIR /llmux
        COPY . .
        RUN cargo build --release

        FROM debian:bookworm-slim

        RUN apt-get update && apt-get install -y \
            curl \
            criu \
            ca-certificates \
            lsb-release \
            && rm -rf /var/lib/apt/lists/*

        # Install Docker CLI via apt (https://docs.docker.com/engine/install/debian/)
        RUN curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc \
            && chmod a+r /etc/apt/keyrings/docker.asc \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] \
                https://download.docker.com/linux/debian \
                $(. /etc/os-release && grep VERSION_CODENAME /etc/os-release | cut -d'=' -f2) stable" \
                > /etc/apt/sources.list.d/docker.list \
            && apt-get update \
            && apt-get install -y docker-ce-cli \
            && rm -rf /var/lib/apt/lists/*

        COPY ./examples/portainer-vllm/warmup.sh /usr/local/bin/warmup.sh
        COPY --from=builder /llmux/target/release/llmux /usr/local/bin/llmux
        COPY ./examples/portainer-vllm/config.yaml /config/config.yaml

        RUN chmod +x /usr/local/bin/warmup.sh

        ENTRYPOINT ["/usr/local/bin/warmup.sh"]
        CMD ["/usr/local/bin/llmux", "-c", "/config/config.yaml"]
    env_file:
      - ${ENV_FILE:-./stack.env}
    privileged: true
    ports:
      - "${LLMMUX_PORT:-11434}:11434"
    environment:
      - LLMUX_CONFIG_PATH=/config/config.yaml
    volumes:
      - ${LLMUX_CONFIG:-./examples/portainer-vllm/config.yaml}:/config/config.yaml:ro
      - llmux-checkpoints:/tmp/llmux-checkpoints
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/v1/models"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  llmux-checkpoints:
    driver: local
