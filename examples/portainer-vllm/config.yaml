# llmux configuration for Docker + vLLM stack with CRIU checkpoint/restore.
#
# Each vLLM container is checkpointed via `docker checkpoint create` when
# switched out, then restored via `docker start --checkpoint` on the next
# wake. This avoids cold-start times (~90s) and frees GPU memory for other
# models.
#
# All containers must run with `--security-opt=seccomp:unconfined` for CRIU
# to capture the process tree. A shared checkpoint volume is mounted into
# each container so checkpoints can be stored on the host.
#
# Priority ordering (higher value = served first, more resistant to preemption):
#   home_assistant: high   (highest priority)
#   images:        medium
#   embeddings:    low    (lowest, preempted by others)
#
# Ports are configurable via environment variables (defaults shown):
#   PORT_HA=8001           home_assistant port
#   PORT_IMAGES=8002       images port
#   PORT_EMBED=8003        embeddings port
#   LLMMUX_PORT=11434      llmux proxy port
#
# Deploy via Portainer stack:
#   - docker-compose.yml and this config.yaml live in a Git repo.
#   - Point Portainer to the repo → Portainer deploys all services.

models:
  home_assistant:
    port: ${PORT_HA:-8001}
    priority: high
    wake: |
      CONTAINER=llmux_home_assistant
      if docker inspect -f '{{.State.Status}}' "$CONTAINER" 2>/dev/null | grep -q running; then
        echo "  $CONTAINER already running"
        exit 0
      fi
      echo "  Attempting restore from checkpoint..."
      if docker start --checkpoint home_assistant_cp "$CONTAINER" 2>/dev/null; then
        echo "  Restored. Waiting for health..."
        for i in $(seq 1 30); do
          curl -sf http://localhost:${PORT_HA:-8001}/v1/models > /dev/null && exit 0
          sleep 1
        done
        echo "  Restore failed, cold starting..."
        docker rm -f "$CONTAINER" 2>/dev/null
        docker run -d --name "$CONTAINER" \
          --privileged --security-opt=seccomp:unconfined \
          --runtime nvidia --gpus all \
          -p ${PORT_HA:-8001}:8000 \
          -v "$${HFCACHE:-~/.cache/huggingface}:/root/.cache/huggingface" \
          -v "$${HFCKPT:-/tmp/llmux-checkpoints}:/ckpt" \
          -v "$${MODEL_PATH:-./models}:/root/models" \
          --env HOME=/tmp \
          --ipc=host \
          vllm/vllm-openai:v0.21.0-cu129 \
              "unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-IQ2_XXS"
              --language-model-only \
              --pipeline-parallel-size 2 \
              --reasoning-parser qwen3 --enable-auto-tool-choice --tool-call-parser qwen3_coder --hf-config-path Qwen/Qwen3.6-35B-A3B --speculative-config '{"method":"qwen3_next_mtp","num_speculative_tokens":2}' \
              --tokenizer Qwen/Qwen3.6-35B-A3B
        for i in $(seq 1 120); do
          curl -sf http://localhost:${PORT_HA:-8001}/v1/models > /dev/null && exit 0
          sleep 1
        done
        exit 1
      fi
      # Full cold start (no checkpoint exists yet)
      echo "  Full cold start..."
      docker rm -f "$CONTAINER" 2>/dev/null
      docker run -d --name "$CONTAINER" \
        --privileged --security-opt=seccomp:unconfined \
        --gpus device=all \
        -p ${PORT_HA:-8001}:8000 \
        -v "$${HFCACHE:-~/.cache/huggingface}:/root/.cache/huggingface" \
        -v "$${HFCKPT:-/tmp/llmux-checkpoints}:/ckpt" \
        -v "$${MODEL_PATH:-./models}:/root/models" \
        --env HOME=/tmp \
        --ipc=host \
        vllm/vllm-openai:v0.21.0-cu129 \
            "unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-IQ2_XXS" \
            --language-model-only \
            --pipeline-parallel-size 2 \
            --reasoning-parser qwen3 --enable-auto-tool-choice --tool-call-parser qwen3_coder --hf-config-path Qwen/Qwen3.6-35B-A3B --speculative-config '{"method":"qwen3_next_mtp","num_speculative_tokens":2}' \
            --tokenizer Qwen/Qwen3.6-35B-A3B
      for i in $(seq 1 120); do
        curl -sf http://localhost:${PORT_HA:-8001}/v1/models > /dev/null && exit 0
        sleep 1
      done
      exit 1
    sleep: |
      CONTAINER=llmux_home_assistant
      echo "  Checkpointing $CONTAINER..."
      docker checkpoint create --checkpoint-dir /ckpt home_assistant_cp "$CONTAINER" 2>&1 || true
      docker stop "$CONTAINER" 2>/dev/null || true
      echo "  $CONTAINER checkpointed and stopped"
    alive: curl -sf http://localhost:${PORT_HA:-8001}/v1/models

