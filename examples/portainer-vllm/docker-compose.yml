version: "3.8"

# Portainer stack for llmux + vLLM services
#
# llmux routes requests based on availability and priority, exposing on port 11434.
#
# Deploy via Portainer → Stack → from repository:
#   repository: https://github.com/your-org/llmux
#   git_folder: examples/portainer-vllm
#   Template: docker-compose.yml
#
# Or locally:
#   docker compose -f docker-compose.yml up -d
#   curl http://localhost:11434/v1/models

services:
  # ── llmux proxy (CPU only) ────────────────────────────────────────────
  llmux:
    build: ./
    env_file:
      - ${ENV_FILE:-.env}
    hostname: llmux
    ports:
      - "11434:11434"
    environment:
      - LLMUX_CONFIG_PATH=/config/config.yaml
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    depends_on:
      home_assistant:
        condition: service_healthy
      images:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/v1/models"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── home_assistant — general chat ──────────────────────────────────────
  home_assistant:
    image: vllm/vllm-openai:v0.20.0-cu129
    hostname: home_assistant
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8001:8000"
    command: >
      vllm serve unsloth/Qwen3.6-35B-A3B-GGUF:UD-IQ2_M
        --language-model-only
        --pipeline-parallel-size 2
    volumes:
      - ${HFCACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - HOME=/tmp
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # ── images — multimodal vision ────────────────────────────────────────
  images:
    image: vllm/vllm-openai:v0.20.0-cu129
    hostname: images
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8002:8000"
    command: >
      vllm serve unsloth/Qwen3.6-35B-A3B-GGUF:UD-IQ2_M
        --pipeline-parallel-size 2
    volumes:
      - ${HFCACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - HOME=/tmp
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # ── embeddings — embedding-only ───────────────────────────────────────
  embeddings:
    image: vllm/vllm-openai:v0.20.0-cu129
    hostname: embeddings
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8003:8000"
    command: >
      vllm serve DevQuasar/Qwen.Qwen3-VL-Embedding-2B-GGUF:Q2_K
        --embedding
        --pipeline-parallel-size 2
    volumes:
      - ${HFCACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - HOME=/tmp
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 120s
    restart: unless-stopped

networks:
  default:
    name: llmux
    driver: bridge
