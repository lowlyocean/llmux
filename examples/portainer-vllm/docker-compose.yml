version: "3.8"

# Portainer stack for llmux + vLLM services with CRIU checkpoint/restore.
#
# Ports are configurable via environment variables (defaults shown):
#   LLMMUX_PORT=11434          llmux proxy port
#   PORT_HA=8001               home_assistant port
#   PORT_IMAGES=8002           images port
#   PORT_EMBED=8003            embeddings port
#
# Deploy via Portainer → Stack → from repository:
#   repository: https://github.com/your-org/llmux
#   git_folder: examples/portainer-vllm
#   Template: docker-compose.yml
#
# Or locally:
#   docker compose -f docker-compose.yml up -d
#   ./warmup.sh          # one-time: pre-build checkpoints for fast first wake

services:
  # ── llmux proxy (CPU only) ─────────────────────────────────────────────
  llmux:
    build: ./
    hostname: llmux
    ports:
      - "${LLMMUX_PORT:-11434}:11434"
    environment:
      - LLMUX_CONFIG_PATH=/config/config.yaml
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - llmux-checkpoints:/tmp/llmux-checkpoints
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      home_assistant:
        condition: service_healthy
      images:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/v1/models"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── home_assistant — general chat (high priority) ──────────────────────
  home_assistant:
    image: vllm/vllm-openai:v0.20.0-cu129
    container_name: llmux_home_assistant
    hostname: home_assistant
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${PORT_HA:-8001}:8000"
    command: >
      vllm serve unsloth/Qwen3.6-35B-A3B-GGUF:UD-IQ2_M
        --language-model-only
        --pipeline-parallel-size 2
    volumes:
      - ${HFCACHE:-~/.cache/huggingface}:/root/.cache/huggingface
      - llmux-checkpoints:/ckpt
    environment:
      - HOME=/tmp
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # ── images — multimodal vision (medium priority) ──────────────────────
  images:
    image: vllm/vllm-openai:v0.20.0-cu129
    container_name: llmux_images
    hostname: images
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${PORT_IMAGES:-8002}:8000"
    command: >
      vllm serve unsloth/Qwen3.6-35B-A3B-GGUF:UD-IQ2_M
        --pipeline-parallel-size 2
    volumes:
      - ${HFCACHE:-~/.cache/huggingface}:/root/.cache/huggingface
      - llmux-checkpoints:/ckpt
    environment:
      - HOME=/tmp
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # ── embeddings — embedding-only (low priority) ────────────────────────
  embeddings:
    image: vllm/vllm-openai:v0.20.0-cu129
    container_name: llmux_embeddings
    hostname: embeddings
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${PORT_EMBED:-8003}:8000"
    command: >
      vllm serve DevQuasar/Qwen.Qwen3-VL-Embedding-2B-GGUF:Q2_K
        --embedding
        --pipeline-parallel-size 2
    volumes:
      - ${HFCACHE:-~/.cache/huggingface}:/root/.cache/huggingface
      - llmux-checkpoints:/ckpt
    environment:
      - HOME=/tmp
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 120s
    restart: unless-stopped

volumes:
  llmux-checkpoints:
    driver: local

networks:
  default:
    name: llmux
    driver: bridge
