version: "3.8"

# Portainer stack for llmux + vLLM services with CRIU checkpoint/restore
#
# llmux routes requests based on availability and priority, exposing on port 11434.
# Only ONE model runs at a time — others are checkpointed (free GPU memory via CRIU).
#
# Checkpoint workflow:
#   - When switching away from a model, llmux runs `docker checkpoint create` (CRIU)
#   - The model container stops, GPU memory is freed, state is saved to disk
#   - On next request for that model, llmux runs `docker start --checkpoint`
#   - Restore is ~10-15s vs ~60-100s cold start
#
# Deploy via Portainer → Stack → from repository:
#   repository: https://github.com/your-org/llmux
#   git_folder: examples/portainer-vllm
#   Template: docker-compose.yml
#
# Or locally:
#   docker compose -f docker-compose.yml up -d
#   ./warmup.sh          # one-time: pre-build checkpoints for fast first wake
#   curl http://localhost:11434/v1/models

services:
  # ── llmux proxy (CPU only) ─────────────────────────────────────────────
  llmux:
    build: ./
    env_file:
      - ${ENV_FILE:-.env}
    hostname: llmux
    ports:
      - "11434:11434"
    environment:
      - LLMUX_CONFIG_PATH=/config/config.yaml
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - llmux-checkpoints:/tmp/llmux-checkpoints
    depends_on:
      home_assistant:
        condition: service_healthy
      images:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/v1/models"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── home_assistant — general chat (high priority) ──────────────────────
  home_assistant:
    image: vllm/vllm-openai:v0.20.0-cu129
    container_name: llmux_home_assistant
    hostname: home_assistant
    # Must run without seccomp for CRIU checkpoint support
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8001:8000"
    command: >
      vllm serve unsloth/Qwen3.6-35B-A3B-GGUF:UD-IQ2_M
        --language-model-only
        --pipeline-parallel-size 2
    volumes:
      - ${HFCACHE:-~/.cache/huggingface}:/root/.cache/huggingface
      - llmux-checkpoints:/ckpt
    environment:
      - HOME=/tmp
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # ── images — multimodal vision (medium priority) ──────────────────────
  images:
    image: vllm/vllm-openai:v0.20.0-cu129
    container_name: llmux_images
    hostname: images
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8002:8000"
    command: >
      vllm serve unsloth/Qwen3.6-35B-A3B-GGUF:UD-IQ2_M
        --pipeline-parallel-size 2
    volumes:
      - ${HFCACHE:-~/.cache/huggingface}:/root/.cache/huggingface
      - llmux-checkpoints:/ckpt
    environment:
      - HOME=/tmp
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # ── embeddings — embedding-only (low priority) ────────────────────────
  embeddings:
    image: vllm/vllm-openai:v0.20.0-cu129
    container_name: llmux_embeddings
    hostname: embeddings
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8003:8000"
    command: >
      vllm serve DevQuasar/Qwen.Qwen3-VL-Embedding-2B-GGUF:Q2_K
        --embedding
        --pipeline-parallel-size 2
    volumes:
      - ${HFCACHE:-~/.cache/huggingface}:/root/.cache/huggingface
      - llmux-checkpoints:/ckpt
    environment:
      - HOME=/tmp
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 120s
    restart: unless-stopped

volumes:
  llmux-checkpoints:
    driver: local

networks:
  default:
    name: llmux
    driver: bridge
